<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
  <link rel="apple-touch-icon" href="/static/images/icon-192.png">
  <link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pagamento não realizado</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#f0ece4;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
h1{font-family:'Playfair Display',serif;color:#f0ece4;font-size:1.6rem;margin-bottom:12px;font-weight:600}
.box{text-align:center;padding:clamp(40px,8vw,60px) clamp(20px,6vw,48px);max-width:420px;width:100%}
.icon{font-size:2.4rem;margin-bottom:20px;opacity:.7}
.msg{color:#888;line-height:1.7;margin-bottom:8px;font-size:.95rem}
.msg-small{color:#555;font-size:.82rem;margin-bottom:32px;line-height:1.6}
.btn-primary{display:inline-block;background:#C9A96E;color:#000;padding:13px 32px;border-radius:8px;font-weight:700;text-decoration:none;font-size:.9rem;margin-bottom:12px}
.btn-secondary{display:inline-block;color:#888;padding:10px 24px;border-radius:8px;font-size:.85rem;text-decoration:none;border:1px solid #333;transition:border-color .2s,color .2s}
.btn-secondary:hover{border-color:#666;color:#f0ece4}
.actions{display:flex;flex-direction:column;align-items:center;gap:.6rem}
</style>
</head>
<body>
<div class="box">
  <div class="icon">○</div>
  <h1>Pagamento não realizado</h1>
  <p class="msg">Algo deu errado na hora de processar.</p>
  <p class="msg-small">Nenhum valor foi cobrado. Você pode tentar novamente ou escolher outra forma de pagamento.</p>
  <div class="actions">
    <a class="btn-primary" href="javascript:history.back()">Tentar novamente</a>
    <a class="btn-secondary" href="/">Voltar ao início</a>
  </div>
</div>
<script>document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});</script>
</body>
</html>
