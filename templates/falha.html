<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
  <link rel="apple-touch-icon" href="/static/images/icon-192.png">
  <link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pagamento não concluído</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#f0ece4;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
h1{font-family:'Playfair Display',serif;color:#C9A96E;font-size:1.8rem;margin-bottom:16px}
.box{text-align:center;padding:60px 40px;max-width:420px}
.icon{font-size:3.5rem;margin-bottom:24px}
p{color:#888;line-height:1.7;margin-bottom:24px}
.btn{display:inline-block;background:#C9A96E;color:#000;padding:14px 36px;border-radius:8px;font-weight:700;text-decoration:none;font-size:1rem}
</style>
</head>
<body>
<div class="box">
  <div class="icon">❌</div>
  <h1>Pagamento não concluído</h1>
  <p>Não foi possível processar seu pagamento. Nenhum valor foi cobrado.</p>
  <a class="btn" href="/">Voltar ao início</a>
</div>
<script>document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});</script>
</body>
</html>
