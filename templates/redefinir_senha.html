{% extends 'base.html' %}
{% block title %}Redefinir senha — Barbearia{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <span class="logo-mark">✦</span>
      <h2 class="auth-title">Nova senha</h2>
      <p class="auth-sub">Digite sua nova senha abaixo</p>
    </div>
    <form class="auth-form" method="POST" novalidate>
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="field">
        <label class="field-label" for="password">Nova senha</label>
        <div class="field-input-wrap">
          <input
            class="field-input"
            type="password"
            id="password"
            name="password"
            placeholder="mínimo 6 caracteres"
            required
            autocomplete="new-password"
          />
          <button type="button" class="toggle-pw" aria-label="Mostrar senha" data-target="password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-gold btn-full btn-lg">Salvar nova senha</button>
    </form>
  </div>
</section>
{% endblock %}
