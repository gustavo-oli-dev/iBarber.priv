{% extends 'gestao/base_gestao.html' %}
{% block title %}Clientes{% endblock %}
{% block content %}
<div class="g-page-header">
  <h1 class="g-page-title">Clientes</h1>
</div>

<!-- Stats -->
<div class="cli-stats" id="cliStats"></div>

<input id="busca" class="g-input" style="margin-bottom:1rem;max-width:480px;" placeholder="Buscar por nome, e-mail ou telefone..." oninput="renderClientes()">

<!-- Desktop: tabela -->
<div class="g-table-wrap desktop-only">
  <table class="g-table">
    <thead>
      <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Desde</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- Mobile: cards -->
<div id="cardsClientes" class="mobile-only"></div>

<style>
.desktop-only { display: block; }
.mobile-only  { display: none; }
@media (max-width: 640px) {
  .desktop-only { display: none; }
  .mobile-only  { display: block; }
}
.cliente-card {
  display: flex;
  align-items: center;
  gap: .85rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .85rem 1rem;
  margin-bottom: .55rem;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.cliente-card:active { opacity: .75; }
.cliente-card-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(200,200,200,.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; font-weight: 700; color: var(--gold);
  flex-shrink: 0;
}
.cliente-card-info { flex: 1; min-width: 0; }
.cliente-card-nome { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cliente-card-sub { font-size: .75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cli-stats {
  display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem;
}
.cli-stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: .55rem 1rem;
  display: flex; flex-direction: column; gap: .1rem;
}
.cli-stat-val { font-size: 1.1rem; font-weight: 700; }
.cli-stat-lbl { font-size: .7rem; color: var(--text-muted); }
</style>

<script>
const CLIENTES = {{ clientes_json|safe }};

(function renderCliStats() {
  const total = CLIENTES.length;
  const mesAtual = new Date().getMonth();
  const anoAtual = new Date().getFullYear();
  const novos = CLIENTES.filter(c => {
    const d = new Date(c.criado_em);
    return d.getMonth() === mesAtual && d.getFullYear() === anoAtual;
  }).length;
  document.getElementById('cliStats').innerHTML =
    `<div class="cli-stat"><span class="cli-stat-val">${total}</span><span class="cli-stat-lbl">Clientes</span></div>` +
    (novos > 0 ? `<div class="cli-stat"><span class="cli-stat-val" style="color:var(--gold)">${novos}</span><span class="cli-stat-lbl">Novos este mês</span></div>` : '');
})();

function fmtData(iso) {
  return new Date(iso).toLocaleDateString('pt-BR');
}

function renderClientes() {
  const q = document.getElementById('busca').value.toLowerCase();
  const qDigits = q.replace(/\D/g, '');
  const filtered = CLIENTES.filter(c => {
    if (!q) return true;
    if ((c.name+' '+c.email).toLowerCase().includes(q)) return true;
    const foneDigits = (c.contact||'').replace(/\D/g,'');
    if (qDigits && foneDigits.includes(qDigits)) return true;
    return false;
  });
  // update page title count when searching
  const busqVal = document.getElementById('busca').value;
  document.getElementById('cliStats').querySelector('.cli-stat-val').textContent =
    busqVal ? filtered.length + '/' + CLIENTES.length : CLIENTES.length;

  // Desktop
  const tbody = document.getElementById('tbody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="color:var(--text-muted);text-align:center;">Nenhum cliente encontrado.</td></tr>';
    document.getElementById('cardsClientes').innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:1rem;">Nenhum cliente encontrado.</p>';
    return;
  }
  tbody.innerHTML = filtered.map(c => {
    const fone = (c.contact||'').replace(/\D/g,'');
    const waBtn = fone
      ? `<a href="https://wa.me/55${fone}" target="_blank" class="g-btn g-btn-outline" style="padding:.25rem .65rem;font-size:.75rem;color:#25d366;border-color:#25d366;text-decoration:none;" onclick="event.stopPropagation()">WhatsApp</a>`
      : '';
    return `<tr style="cursor:pointer;" onclick="location.href='/gestao/clientes/${c.id}'">
      <td style="font-weight:500;">${c.name}</td>
      <td style="color:var(--text-muted)">${c.email}</td>
      <td>${c.contact||'—'}</td>
      <td style="color:var(--text-muted)">${fmtData(c.criado_em)}</td>
      <td>${waBtn}</td>
    </tr>`;
  }).join('');

  // Mobile cards
  document.getElementById('cardsClientes').innerHTML = filtered.map(c => {
    const fone = (c.contact||'').replace(/\D/g,'');
    const letra = c.name.charAt(0).toUpperCase();
    const sub = [c.contact, fmtData(c.criado_em)].filter(Boolean).join(' · ');
    const waHtml = fone
      ? `<a href="https://wa.me/55${fone}" target="_blank" onclick="event.stopPropagation()"
           style="background:#1a2b1a;border:1px solid rgba(37,211,102,.4);color:#25d366;border-radius:6px;padding:3px 9px;font-size:.75rem;text-decoration:none;white-space:nowrap;flex-shrink:0;">WPP</a>`
      : '';
    return `<a class="cliente-card" href="/gestao/clientes/${c.id}">
      <div class="cliente-card-avatar">${letra}</div>
      <div class="cliente-card-info">
        <div class="cliente-card-nome">${c.name}</div>
        <div class="cliente-card-sub">${sub}</div>
      </div>
      ${waHtml}
    </a>`;
  }).join('');
}

renderClientes();
</script>
{% endblock %}
