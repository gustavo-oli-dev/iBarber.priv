{% extends 'gestao/base_gestao.html' %}
{% block title %}Calendário{% endblock %}

{% block head %}
<style>
.cal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.25rem;
}
.cal-mes-label {
  font-family: var(--font-serif);
  font-size: 1.15rem; font-weight: 600; color: var(--text);
}
.cal-nav {
  display: flex; gap: .4rem;
}
.cal-nav-btn {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-muted); cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: .15s;
}
.cal-nav-btn:hover { color: var(--text); border-color: var(--gold-dim); }

.cal-grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  min-width: 300px;
}
.cal-dow {
  text-align: center; font-size: .68rem; font-weight: 600;
  color: var(--text-muted); padding: .35rem 0; text-transform: uppercase;
  letter-spacing: .06em;
}
.cal-cell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-height: 70px;
  padding: .4rem .45rem;
  cursor: pointer;
  transition: background .12s;
  position: relative;
}
.cal-cell:hover { background: var(--surface2); }
.cal-cell.today { border-color: var(--gold); }
.cal-cell.outro-mes { opacity: .35; pointer-events: none; }
.cal-cell.tem-ag { border-color: rgba(200,200,200,.3); }
.cal-num {
  font-size: .8rem; font-weight: 600; color: var(--text-muted);
  display: block; margin-bottom: .25rem;
}
.cal-cell.today .cal-num { color: var(--gold); }
.cal-ags-wrap { display: flex; flex-direction: column; gap: 2px; }
.cal-ag-chip {
  font-size: .62rem; font-weight: 500;
  background: rgba(200,200,200,.1);
  border-radius: 3px; padding: 1px 4px;
  color: var(--text); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.cal-ag-chip.nao_compareceu { background: rgba(255,165,0,.15); color: #FFA500; }
.cal-ag-chip.cancelado      { background: rgba(224,85,85,.15);  color: var(--error); opacity:.7; }
.cal-ag-chip.pago           { background: rgba(76,175,130,.15); color: var(--success); }
.cal-mais { font-size: .6rem; color: var(--text-muted); margin-top: 1px; }

/* Drawer detalhe dia */
.dia-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:300; }
.dia-overlay.open { display:block; }
.dia-panel {
  position: fixed; right: 0; top: 0; bottom: 0;
  width: 340px; max-width: 100vw;
  background: var(--surface); border-left: 1px solid var(--border);
  z-index: 301; transform: translateX(100%);
  transition: transform .22s ease;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 1.25rem;
}
.dia-panel.open { transform: translateX(0); }
@media (max-width: 768px) {
  .dia-panel { width: 100vw; border-left: none; border-top: 1px solid var(--border); top: auto; height: 70vh; transform: translateY(100%); }
  .dia-panel.open { transform: translateY(0); }
}
.dia-close {
  background: none; border: none; color: var(--text-muted);
  font-size: 1.4rem; cursor: pointer; float: right; line-height: 1;
}
.dia-titulo { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; padding-right: 1.5rem; }
.dia-ag-item {
  display: flex; flex-direction: column; gap: .2rem;
  background: var(--surface2); border-radius: var(--radius);
  padding: .75rem .9rem; margin-bottom: .55rem;
}
.dia-ag-hora { font-size: .85rem; font-weight: 700; color: var(--gold); }
.dia-ag-nome { font-size: .9rem; font-weight: 600; }
.dia-ag-sub  { font-size: .75rem; color: var(--text-muted); }
.dia-ag-badge {
  display: inline-block; font-size: .65rem; font-weight: 600;
  padding: .1rem .45rem; border-radius: 20px; margin-top: .2rem;
  align-self: flex-start;
}
</style>
{% endblock %}

{% block content %}
<div class="cal-header">
  <h1 class="g-page-title" style="margin:0">Calendário</h1>
  <div style="display:flex;align-items:center;gap:.75rem;">
    <span class="cal-mes-label" id="mesLabel"></span>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="navMes(-1)">‹</button>
      <button class="cal-nav-btn" onclick="navMes(1)">›</button>
    </div>
  </div>
</div>

<div class="cal-grid-wrap">
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- Drawer detalhe do dia -->
<div class="dia-overlay" id="diaOverlay" onclick="fecharDia()"></div>
<div class="dia-panel"   id="diaPanel">
  <button class="dia-close" onclick="fecharDia()">×</button>
  <div id="diaConteudo"></div>
</div>

<script>
const TOKEN = "{{ token }}";
const MESES_PT  = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_DOW  = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const STATUS_COR = {
  pago:'pago', cancelado:'cancelado', nao_compareceu:'nao_compareceu'
};
const STATUS_LABEL = {
  pago:'Realizado', cancelado:'Cancelado', nao_compareceu:'Não compareceu', pendente:'Pendente'
};

let agendamentos = [];
let mesAtual = new Date();
mesAtual.setDate(1);

async function carregar() {
  try {
    const r = await fetch('/api/agendamentos', {headers:{'Authorization':'Bearer '+TOKEN}});
    agendamentos = await r.json();
  } catch(e) { agendamentos = []; }
  renderCalendario();
}

function navMes(delta) {
  mesAtual = new Date(mesAtual.getFullYear(), mesAtual.getMonth() + delta, 1);
  renderCalendario();
}

function renderCalendario() {
  const ano = mesAtual.getFullYear();
  const mes = mesAtual.getMonth();
  document.getElementById('mesLabel').textContent = MESES_PT[mes] + ' ' + ano;

  const hoje = new Date();
  const primeiroDia = new Date(ano, mes, 1);
  const ultimoDia   = new Date(ano, mes + 1, 0);

  // Indexar agendamentos por data
  const porDia = {};
  for (const ag of agendamentos) {
    if (ag.status === 'cancelado') continue;
    const d = (ag.data_hora || '').split('T')[0];
    if (!porDia[d]) porDia[d] = [];
    porDia[d].push(ag);
  }

  const grid = document.getElementById('calGrid');
  let html = DIAS_DOW.map(d =>
    `<div class="cal-dow">${d}</div>`
  ).join('');

  // offset: domingo=0
  const offset = primeiroDia.getDay();
  // Dias do mês anterior para preencher
  for (let i = 0; i < offset; i++) {
    const d = new Date(ano, mes, -(offset - 1 - i));
    html += `<div class="cal-cell outro-mes"><span class="cal-num">${d.getDate()}</span></div>`;
  }

  for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
    const dt   = new Date(ano, mes, dia);
    const iso  = toISO(dt);
    const ags  = porDia[iso] || [];
    const isHoje = dt.toDateString() === hoje.toDateString();
    const cls  = ['cal-cell', isHoje?'today':'', ags.length?'tem-ag':''].filter(Boolean).join(' ');

    const chips = ags.slice(0,3).map(ag => {
      const hora = (ag.data_hora||'').split('T')[1]?.slice(0,5) || '';
      const cls2 = 'cal-ag-chip ' + (STATUS_COR[ag.status]||'');
      return `<div class="${cls2}">${hora} ${esc(ag.usuario||'')}</div>`;
    }).join('');
    const mais = ags.length > 3 ? `<div class="cal-mais">+${ags.length-3} mais</div>` : '';

    html += `<div class="${cls}" onclick="abrirDia('${iso}')">
      <span class="cal-num">${dia}</span>
      <div class="cal-ags-wrap">${chips}${mais}</div>
    </div>`;
  }

  // Completar última linha
  const totalCells = offset + ultimoDia.getDate();
  const resto = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= resto; i++) {
    html += `<div class="cal-cell outro-mes"><span class="cal-num">${i}</span></div>`;
  }

  grid.innerHTML = html;
}

function toISO(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function abrirDia(iso) {
  const [ano, mes, dia] = iso.split('-').map(Number);
  const dt = new Date(ano, mes-1, dia);
  const ags = agendamentos.filter(ag => (ag.data_hora||'').startsWith(iso));
  ags.sort((a,b) => a.data_hora.localeCompare(b.data_hora));

  const titulo = DIAS_DOW[dt.getDay()] + ', ' + dia + ' de ' + MESES_PT[mes-1];

  let itens = '';
  if (!ags.length) {
    itens = '<p style="color:var(--text-muted);font-size:.875rem;">Sem agendamentos neste dia.</p>';
  } else {
    itens = ags.map(ag => {
      const hora  = (ag.data_hora||'').split('T')[1]?.slice(0,5) || '—';
      const st    = ag.status || 'pendente';
      const label = STATUS_LABEL[st] || st;
      const corMap = {pago:'var(--success)',cancelado:'var(--error)',nao_compareceu:'#FFA500',pendente:'#f0c040'};
      const bgMap  = {pago:'rgba(76,175,130,.15)',cancelado:'rgba(224,85,85,.15)',nao_compareceu:'rgba(255,165,0,.15)',pendente:'rgba(240,192,64,.15)'};
      const badgeStyle = `background:${bgMap[st]||bgMap.pendente};color:${corMap[st]||corMap.pendente};`;
      const tel   = (ag.contato||'').replace(/\D/g,'');
      const wpp   = tel ? `<a href="https://wa.me/55${tel}" target="_blank"
        style="font-size:.72rem;color:#25d366;text-decoration:none;margin-top:.3rem;display:inline-block;">
        📱 WhatsApp</a>` : '';
      return `<div class="dia-ag-item">
        <div class="dia-ag-hora">${hora}</div>
        <div class="dia-ag-nome">${esc(ag.usuario||'—')}</div>
        <div class="dia-ag-sub">${esc(ag.servico||'')}${ag.barbeiro?' · '+esc(ag.barbeiro):''}</div>
        <span class="dia-ag-badge" style="${badgeStyle}">${label}</span>
        ${wpp}
      </div>`;
    }).join('');
  }

  document.getElementById('diaConteudo').innerHTML =
    `<div class="dia-titulo">${titulo}</div>
     <div id="escalaDia" style="margin-bottom:1rem;"></div>
     ${itens}`;
  document.getElementById('diaOverlay').classList.add('open');
  document.getElementById('diaPanel').classList.add('open');
  carregarEscala(iso);
}

let _escalaIso = '';
async function carregarEscala(iso) {
  _escalaIso = iso;
  const box = document.getElementById('escalaDia');
  if (!box) return;
  try {
    const r = await fetch(`/api/escala/${iso}`, {headers:{'Authorization':'Bearer '+TOKEN}});
    const lista = await r.json();
    if (!Array.isArray(lista) || !lista.length) { box.innerHTML = ''; return; }
    box.innerHTML = `
      <div style="font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:.5rem;">Barbeiros neste dia</div>
      ${lista.map(f => `
        <label style="display:flex;align-items:center;gap:.6rem;padding:.35rem 0;cursor:pointer;">
          <input type="checkbox" data-fid="${f.id}" ${f.trabalhando?'checked':''} onchange="salvarEscala()" style="accent-color:var(--gold);width:16px;height:16px;">
          <span style="font-size:.85rem;">${esc(f.nome)}</span>
        </label>`).join('')}`;
  } catch(e) { box.innerHTML = ''; }
}

async function salvarEscala() {
  const iso = _escalaIso;
  const checks = document.querySelectorAll('#escalaDia input[type=checkbox]');
  const trabalhando = [...checks].filter(c=>c.checked).map(c=>parseInt(c.dataset.fid));
  await fetch(`/api/escala/${iso}`, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
    body: JSON.stringify({trabalhando})
  });
}

function fecharDia() {
  document.getElementById('diaOverlay').classList.remove('open');
  document.getElementById('diaPanel').classList.remove('open');
}

carregar();
</script>
{% endblock %}
