<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — iBarber Gestão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080808; --surface: #111111; --border: #222222;
      --gold: #C8C8C8; --text: #F2F2F2; --text-muted: #5A5A5A;
      --error: #e05555; --success: #4caf82; --radius: 8px;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Inter', system-ui, sans-serif;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%; max-width: 380px;
    }
    .login-logo {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--text);
      text-align: center;
      margin-bottom: 0.25rem;
    }
    .login-logo span { color: var(--gold); }
    .login-sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-bottom: 2rem;
    }
    .g-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; display: block; margin-bottom: 0.4rem; }
    .g-input {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      padding: 0.6rem 0.85rem; font-family: var(--font-sans); font-size: 0.9rem;
      width: 100%; transition: border-color 0.15s;
      min-height: 44px; -webkit-appearance: none;
    }
    .g-input:focus { outline: none; border-color: var(--gold); }
    .form-group { margin-bottom: 1.1rem; }
    .btn-login {
      width: 100%; padding: 0.65rem; border: none; border-radius: var(--radius);
      background: var(--gold); color: #000; font-family: var(--font-sans);
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s; margin-top: 0.5rem;
      min-height: 44px; touch-action: manipulation;
    }
    .btn-login:hover { opacity: 0.85; }
    .ib-erro { color: var(--error); font-size: .72rem; margin-top: .2rem; display: block; }
    .ib-invalido { border-color: var(--error) !important; }
    .flash {
      padding: 0.65rem 0.9rem; border-radius: var(--radius);
      margin-bottom: 1rem; font-size: 0.85rem;
    }
    .flash-error { background: color-mix(in srgb, var(--error) 12%, transparent); color: var(--error); border: 1px solid var(--error); }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo"><span>✦</span> iBarber</div>
    <div class="login-sub">Painel de Gestão</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('gestao_login') }}">
      <div class="form-group">
        <label class="g-label" for="email">E-mail</label>
        <input class="g-input" type="email" id="email" name="email" required placeholder="seu@email.com" data-validate="email" />
      </div>
      <div class="form-group">
        <label class="g-label" for="senha">Senha</label>
        <div style="position:relative;">
          <input class="g-input" type="password" id="senha" name="senha" required placeholder="••••••••" style="padding-right:2.5rem;" />
          <button type="button" onclick="this.previousElementSibling.type=this.previousElementSibling.type==='password'?'text':'password'" style="position:absolute;right:.65rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1rem;padding:0;line-height:1;">👁</button>
        </div>
      </div>
      <button class="btn-login" type="submit">Entrar</button>
    </form>
  </div>
<script src="/static/js/ibarber-forms.js"></script>
</body>
</html>
