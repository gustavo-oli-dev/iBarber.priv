{% extends 'base.html' %}
{% block title %}Entrar — Barbearia{% endblock %}
{% block content %}
<style>.fab { display: none !important; }</style>
<section class="auth-section">
  <div class="auth-card stagger">
    <div class="auth-header">
      <span class="logo-mark">✦</span>
      <h1 class="auth-title">Entrar</h1>
      <p class="auth-sub">Acesse sua conta</p>
    </div>
    <form class="auth-form" method="POST" action="{{ url_for('login') }}" novalidate
          onsubmit="this.querySelector('[type=submit]').classList.add('btn-loading')">
      <div class="field">
        <label class="field-label" for="email">E-mail</label>
        <input
          class="field-input"
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com"
          required
          autocomplete="email"
          oninput="this.value=this.value.toLowerCase()"
        />
      </div>
      <div class="field">
        <label class="field-label" for="password">Senha</label>
        <div class="field-input-wrap">
          <input
            class="field-input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pw" aria-label="Mostrar senha" data-target="password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-gold btn-full btn-lg">Entrar</button>
    </form>
    <div class="auth-divider"><span>ou</span></div>
    <button type="button" class="btn btn-outline btn-full" onclick="mostrarAcessoRapido()">Continuar sem cadastro</button>

    <form class="auth-form" id="formRapido" method="POST" action="{{ url_for('login_rapido') }}" novalidate style="display:none;margin-top:1rem;">
      <div class="field">
        <label class="field-label" for="rNome">Nome *</label>
        <input class="field-input" type="text" id="rNome" name="nome" placeholder="Seu nome" required />
      </div>
      <div class="field">
        <label class="field-label" for="rContato">WhatsApp / Contato <span class="required">*</span></label>
        <input class="field-input" type="tel" id="rContato" name="contato" placeholder="(00) 00000-0000" required />
      </div>
      <div class="field">
        <label class="field-label" for="rAlergia">Alergia ou observação</label>
        <textarea class="field-input" id="rAlergia" name="alergia" rows="2" placeholder="Ex: alergia a amônia..."></textarea>
      </div>
      <button type="submit" class="btn btn-gold btn-full btn-lg"
              onsubmit="this.classList.add('btn-loading')">Continuar</button>
      <p style="margin-top:1rem;font-size:0.8rem;color:var(--text-muted);text-align:center;line-height:1.4;">
        <strong style="color:var(--text);">Você só irá receber lembretes se se cadastrar.</strong>
      </p>
      <p class="auth-switch" style="margin-top:0.6rem;">
        <a href="#" class="link-gold" onclick="voltarLogin(event)">Voltar para login</a>
      </p>
    </form>

    <div id="linksLogin">
      <p class="auth-switch" style="margin-top:0.8rem;">
        <a href="{{ url_for('esqueci_senha') }}" class="link-gold">Esqueci minha senha</a>
      </p>
      <p class="auth-switch">
        Não tem conta? <a href="{{ url_for('register') }}" class="link-gold">Cadastre-se</a>
      </p>
    </div>
  </div>
</section>
<script>
function mostrarAcessoRapido() {
  document.querySelector('.auth-form').style.display = 'none';
  document.querySelector('.auth-divider').style.display = 'none';
  document.querySelector('[onclick="mostrarAcessoRapido()"]').style.display = 'none';
  document.getElementById('linksLogin').style.display = 'none';
  document.getElementById('formRapido').style.display = 'block';
}
function voltarLogin(e) {
  e.preventDefault();
  document.querySelector('.auth-form').style.display = 'block';
  document.querySelector('.auth-divider').style.display = 'flex';
  document.querySelector('[onclick="mostrarAcessoRapido()"]').style.display = 'block';
  document.getElementById('linksLogin').style.display = 'block';
  document.getElementById('formRapido').style.display = 'none';
}
</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.fab').forEach(function(el) { el.remove(); });
});
</script>
{% endblock %}
