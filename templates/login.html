{% extends 'base.html' %}
{% block title %}Entrar — Barbearia{% endblock %}
{% block content %}
<style>
.fab { display: none !important; }
.step { display: none; }
.step.ativo { display: block; }
.tel-input-wrap { display: flex; gap: .5rem; align-items: stretch; }
.tel-prefix {
  background: var(--surface, #161616);
  border: 1px solid var(--border, #2a2a2a);
  border-radius: var(--radius, 6px);
  padding: 0 .75rem;
  color: var(--text-muted, #888);
  font-size: .95rem;
  display: flex;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .7rem .9rem;
  background: var(--surface, #161616);
  border: 1px solid var(--border, #2a2a2a);
  border-radius: var(--radius, 6px);
  cursor: pointer;
  user-select: none;
}
.toggle-label { font-size: .9rem; color: var(--text, #f0ece4); }
.toggle-sub { font-size: .74rem; color: var(--text-muted, #888); margin-top: .1rem; }
.toggle-switch {
  position: relative; width: 40px; height: 22px; flex-shrink: 0;
}
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute; inset: 0;
  background: #333; border-radius: 22px;
  transition: background .2s;
  cursor: pointer;
}
.toggle-track:before {
  content: ''; position: absolute;
  width: 16px; height: 16px; border-radius: 50%;
  left: 3px; top: 3px;
  background: #888; transition: .2s;
}
.toggle-switch input:checked + .toggle-track { background: var(--gold, #C9A96E); }
.toggle-switch input:checked + .toggle-track:before { transform: translateX(18px); background: #000; }
.boas-vindas {
  text-align: center;
  padding: 1.2rem 0 .4rem;
}
.boas-vindas-nome { font-size: 1.2rem; font-weight: 600; color: var(--gold, #C9A96E); }
.boas-vindas-sub  { font-size: .85rem; color: var(--text-muted, #888); margin-top: .3rem; }
</style>
<section class="auth-section">
  <div class="auth-card stagger">
    <div class="auth-header">
      <span class="logo-mark">✦</span>
      <h1 class="auth-title" id="loginTitulo">Entrar</h1>
      <p class="auth-sub" id="loginSub">Informe seu WhatsApp</p>
    </div>

    <!-- Etapa 1: telefone -->
    <div class="step ativo" id="step1">
      <div class="field">
        <label class="field-label">WhatsApp</label>
        <div class="tel-input-wrap">
          <span class="tel-prefix">🇧🇷 +55</span>
          <input class="field-input" type="tel" id="inputTel"
                 placeholder="(11) 99999-9999"
                 inputmode="numeric"
                 oninput="mascaraTel(this)"
                 style="flex:1;" />
        </div>
      </div>
      <button class="btn btn-gold btn-full btn-lg" id="btnContinuar" onclick="verificarTelefone()">Continuar</button>
      <p id="erroStep1" style="color:#c0392b;font-size:.8rem;text-align:center;margin-top:.6rem;display:none;"></p>
    </div>

    <!-- Etapa 2: novo usuário -->
    <div class="step" id="step2">
      <div class="field">
        <label class="field-label">Seu nome</label>
        <input class="field-input" type="text" id="inputNome"
               placeholder="Como quer ser chamado?" autocomplete="given-name" />
      </div>

      <div class="toggle-row" onclick="toggleLembretes()" style="margin-bottom:.6rem;">
        <div>
          <div class="toggle-label">Receber lembretes</div>
          <div class="toggle-sub">Te avisamos antes do horário por e-mail</div>
        </div>
        <label class="toggle-switch" onclick="event.stopPropagation()">
          <input type="checkbox" id="chkLembretes" onchange="mostrarEmail(this.checked)" />
          <span class="toggle-track"></span>
        </label>
      </div>

      <div class="field" id="campoEmail" style="display:none;">
        <label class="field-label">E-mail para lembretes</label>
        <input class="field-input" type="email" id="inputEmail"
               placeholder="seu@email.com"
               autocomplete="email"
               oninput="this.value=this.value.toLowerCase()" />
      </div>

      <button class="btn btn-gold btn-full btn-lg" id="btnCriar" onclick="criarConta()">Entrar</button>
      <p id="erroStep2" style="color:#c0392b;font-size:.8rem;text-align:center;margin-top:.6rem;display:none;"></p>
      <p class="auth-switch" style="margin-top:.8rem;">
        <a href="#" class="link-gold" onclick="voltarStep1(event)">Voltar</a>
      </p>
    </div>

    <!-- Boas-vindas (usuário existente) -->
    <div class="step" id="stepBemVindo">
      <div class="boas-vindas">
        <div class="boas-vindas-nome" id="bemVindoNome"></div>
        <div class="boas-vindas-sub">Entrando…</div>
      </div>
    </div>
  </div>
</section>
<script>
let _tel = '';

function mascaraTel(el) {
  let v = el.value.replace(/\D/g, '').slice(0, 11);
  if (v.length > 2)  v = '(' + v.slice(0,2) + ') ' + v.slice(2);
  if (v.length > 10) v = v.slice(0,10) + '-' + v.slice(10);
  el.value = v;
}

function _soDigitos(v) { return v.replace(/\D/g, ''); }

function _setLoading(btn, ok) {
  btn.disabled = !ok;
  if (!ok) btn.classList.add('btn-loading');
  else     btn.classList.remove('btn-loading');
}

async function verificarTelefone() {
  const tel = _soDigitos(document.getElementById('inputTel').value);
  const err = document.getElementById('erroStep1');
  err.style.display = 'none';
  if (tel.length < 10) { err.textContent = 'Informe um número válido.'; err.style.display = 'block'; return; }
  _tel = tel;
  const btn = document.getElementById('btnContinuar');
  _setLoading(btn, false);
  try {
    const res  = await fetch('/api/auth/telefone', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({telefone: tel}),
    });
    const data = await res.json();
    _setLoading(btn, true);
    if (data.ok) {
      document.getElementById('step1').classList.remove('ativo');
      document.getElementById('stepBemVindo').classList.add('ativo');
      document.getElementById('bemVindoNome').textContent = 'Olá, ' + data.nome + '! 👋';
      setTimeout(() => { window.location.href = '/servicos'; }, 900);
    } else if (data.novo) {
      document.getElementById('step1').classList.remove('ativo');
      document.getElementById('step2').classList.add('ativo');
      document.getElementById('loginTitulo').textContent = 'Criar conta';
      document.getElementById('loginSub').textContent = 'Só mais dois segundos';
    } else {
      err.textContent = data.erro || 'Erro ao verificar.';
      err.style.display = 'block';
    }
  } catch(e) {
    _setLoading(btn, true);
    err.textContent = 'Erro de conexão.';
    err.style.display = 'block';
  }
}

function toggleLembretes() {
  const chk = document.getElementById('chkLembretes');
  chk.checked = !chk.checked;
  mostrarEmail(chk.checked);
}

function mostrarEmail(mostrar) {
  document.getElementById('campoEmail').style.display = mostrar ? 'block' : 'none';
  if (!mostrar) document.getElementById('inputEmail').value = '';
}

async function criarConta() {
  const nome  = document.getElementById('inputNome').value.trim();
  const email = document.getElementById('inputEmail').value.trim();
  const lembretes = document.getElementById('chkLembretes').checked;
  const err   = document.getElementById('erroStep2');
  err.style.display = 'none';
  if (!nome) { err.textContent = 'Informe seu nome.'; err.style.display = 'block'; return; }
  if (lembretes && !email) { err.textContent = 'Informe o e-mail para receber lembretes.'; err.style.display = 'block'; return; }
  const btn = document.getElementById('btnCriar');
  _setLoading(btn, false);
  try {
    const res  = await fetch('/api/auth/criar-telefone', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({telefone: _tel, nome, email: email || '', lembretes}),
    });
    const data = await res.json();
    _setLoading(btn, true);
    if (data.ok) {
      document.getElementById('step2').classList.remove('ativo');
      document.getElementById('stepBemVindo').classList.add('ativo');
      document.getElementById('bemVindoNome').textContent = 'Bem-vindo, ' + data.nome + '! 👋';
      setTimeout(() => { window.location.href = '/servicos'; }, 900);
    } else {
      err.textContent = data.erro || 'Erro ao criar conta.';
      err.style.display = 'block';
    }
  } catch(e) {
    _setLoading(btn, true);
    err.textContent = 'Erro de conexão.';
    err.style.display = 'block';
  }
}

function voltarStep1(e) {
  e.preventDefault();
  document.getElementById('step2').classList.remove('ativo');
  document.getElementById('step1').classList.add('ativo');
  document.getElementById('loginTitulo').textContent = 'Entrar';
  document.getElementById('loginSub').textContent = 'Informe seu WhatsApp';
  document.getElementById('erroStep2').style.display = 'none';
}

document.getElementById('inputTel').addEventListener('keydown', e => {
  if (e.key === 'Enter') verificarTelefone();
});
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.fab').forEach(el => el.remove());
});
</script>
{% endblock %}
