<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
  <link rel="apple-touch-icon" href="/static/images/icon-192.png">
  <link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Conta — iBarber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);
  --gold:#C9A96E;--gold2:#e0be88;--text:#f5f5f5;--muted:#888;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
body{display:flex;flex-direction:column}

/* TOPBAR */
.topbar{
  height:54px;flex-shrink:0;
  display:flex;align-items:center;gap:1.25rem;
  padding:0 1.25rem 0 1.5rem;
  background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.topbar-logo{font-size:.88rem;font-weight:700;letter-spacing:.1em;display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.topbar-logo span{color:var(--gold)}
.tb-sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.steps{display:flex;align-items:center;gap:0;flex:1;justify-content:center}
.step-item{display:flex;align-items:center;gap:.45rem;padding:5px 12px;border-radius:50px;font-size:.76rem;font-weight:500;color:var(--muted);white-space:nowrap}
.step-item.active{color:var(--gold)}
.step-num{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;flex-shrink:0}
.step-item.done .step-num{background:var(--gold);border-color:var(--gold);color:#000}
.step-conn{width:28px;height:1px;background:var(--border)}
.topbar-right{display:flex;align-items:center;gap:.6rem;margin-left:auto}
.btn-back{background:transparent;color:var(--muted);border:1px solid var(--border);padding:7px 16px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.btn-back:hover{background:var(--surface);color:var(--text)}

/* PAGE */
.page{flex:1;display:flex;flex-direction:column;align-items:center;padding:3rem 1.5rem 4rem}
.page-hd{text-align:center;margin-bottom:2.5rem}
.page-hd h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;margin-bottom:.6rem}
.page-hd h1 span{color:var(--gold)}
.page-hd p{color:var(--muted);font-size:.95rem}

/* FORM CARD */
.form-card{
  width:100%;max-width:480px;
  background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:18px;padding:2.25rem 2rem;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}}
.fg{display:flex;flex-direction:column;gap:.35rem}
.fg.full{grid-column:1/-1}
.fg label{font-size:.75rem;color:var(--muted);font-weight:500;letter-spacing:.03em}
.fg input{
  background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);
  padding:10px 13px;border-radius:9px;font-size:.88rem;width:100%;
  outline:none;transition:border-color .2s;font-family:'Inter',sans-serif;
}
.fg input:focus{border-color:var(--gold)}
.fg input::placeholder{color:#444}
.fg .hint{font-size:.7rem;color:#555;margin-top:.15rem}
.fg .err{font-size:.72rem;color:#f87171;display:none;margin-top:.15rem}

.divider{grid-column:1/-1;height:1px;background:var(--border);margin:.25rem 0}

.btn-criar{
  width:100%;padding:13px;background:var(--gold);color:#000;border:none;
  border-radius:9px;font-size:.95rem;font-weight:800;cursor:pointer;
  transition:background .2s,transform .15s;margin-top:1.25rem;
  letter-spacing:.02em;
}
.btn-criar:hover{background:var(--gold2);transform:translateY(-1px)}
.btn-criar:disabled{opacity:.4;cursor:default;transform:none}

.err-geral{font-size:.82rem;color:#f87171;text-align:center;display:none;margin-top:.75rem}

/* GLOW */
.glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(201,169,110,.07) 0%,transparent 70%);pointer-events:none;z-index:0}
</style>
</head>
<body>

<div class="glow"></div>

<!-- TOPBAR -->
<header class="topbar">
  <a href="/landing" class="topbar-logo"><span>✦</span> iBarber</a>
  <div class="tb-sep"></div>
  <div class="steps">
    <div class="step-item done"><div class="step-num">1</div> Estilo</div>
    <div class="step-conn"></div>
    <div class="step-item done"><div class="step-num">2</div> Plano</div>
    <div class="step-conn"></div>
    <div class="step-item active"><div class="step-num">3</div> Cadastro</div>
    <div class="step-conn"></div>
    <div class="step-item"><div class="step-num">4</div> Pagamento</div>
  </div>
  <div class="topbar-right">
    <button class="btn-back" onclick="history.back()">← Voltar</button>
  </div>
</header>

<!-- PAGE -->
<main class="page">
  <div class="page-hd">
    <h1>Criar sua <span>conta</span></h1>
    <p>Dados da sua barbearia e acesso ao painel</p>
  </div>

  <div class="form-card">
    <div class="form-grid">

      <div class="fg full">
        <label>Nome da barbearia</label>
        <input type="text" id="f-nome" placeholder="Ex: Barbearia do João" oninput="onNome(this.value)">
      </div>

      <div class="fg full">
        <label>Seu link exclusivo</label>
        <input type="text" id="f-slug" placeholder="barbearia-do-joao" oninput="onSlug(this.value)">
        <span class="hint">barberos.app/<span id="slug-preview">seu-link</span></span>
        <span class="err" id="err-slug"></span>
      </div>

      <div class="fg full">
        <label>WhatsApp</label>
        <input type="tel" id="f-whats" placeholder="(11) 99999-9999">
      </div>

      <div class="divider"></div>

      <div class="fg full">
        <label>E-mail de acesso</label>
        <input type="email" id="f-email" placeholder="email@exemplo.com">
        <span class="err" id="err-email"></span>
      </div>

      <div class="fg">
        <label>Senha</label>
        <input type="password" id="f-senha" placeholder="Mín. 6 caracteres">
      </div>

      <div class="fg">
        <label>Confirmar senha</label>
        <input type="password" id="f-senha2" placeholder="Repita a senha">
        <span class="err" id="err-senha"></span>
      </div>

    </div>

    <button class="btn-criar" id="btn-criar" onclick="submeter()">Criar conta e pagar →</button>
    <div class="err-geral" id="err-geral"></div>
  </div>
</main>

<script>
let slugTouched = false;

function onNome(val) {
  if(!slugTouched) {
    const slug = val.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,30);
    document.getElementById('f-slug').value = slug;
    document.getElementById('slug-preview').textContent = slug || 'seu-link';
  }
}

function onSlug(val) {
  slugTouched = true;
  const slug = val.toLowerCase().replace(/[^a-z0-9-]/g,'');
  document.getElementById('f-slug').value = slug;
  document.getElementById('slug-preview').textContent = slug || 'seu-link';
  document.getElementById('err-slug').style.display = 'none';
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}

function clearErrs() {
  ['err-slug','err-email','err-senha','err-geral'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
}

async function submeter() {
  const nome  = document.getElementById('f-nome').value.trim();
  const slug  = document.getElementById('f-slug').value.trim();
  const whats = document.getElementById('f-whats').value.trim();
  const email = document.getElementById('f-email').value.trim().toLowerCase();
  const senha = document.getElementById('f-senha').value;
  const senha2= document.getElementById('f-senha2').value;

  clearErrs();

  if(!nome) { showErr('err-geral','Informe o nome da barbearia'); return; }
  if(!slug || !/^[a-z0-9-]{3,30}$/.test(slug)) {
    showErr('err-slug','Link inválido (letras, números e hífens, 3-30 chars)'); return;
  }
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showErr('err-email','E-mail inválido'); return;
  }
  if(senha.length < 6) { showErr('err-senha','Mínimo 6 caracteres'); return; }
  if(senha !== senha2) { showErr('err-senha','As senhas não coincidem'); return; }

  const tema = JSON.parse(localStorage.getItem('onb_tema') || '{}');

  const btn = document.getElementById('btn-criar');
  btn.disabled = true; btn.textContent = 'Criando conta...';

  try {
    const r = await fetch('/api/cadastro-personalizar', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({nome, slug, whatsapp:whats, email, senha, tema})
    });
    const d = await r.json();
    if(d.ok) {
      localStorage.setItem('onb_tenant_id', d.tenant_id);
      localStorage.setItem('onb_slug', d.slug);
      window.location.href = '/pagamento';
    } else {
      showErr('err-geral', d.erro || 'Erro ao criar a conta');
    }
  } catch(e) {
    showErr('err-geral','Erro de conexão. Tente novamente.');
  } finally {
    btn.disabled = false; btn.textContent = 'Criar conta e pagar →';
  }
}
</script>
</body>
</html>
