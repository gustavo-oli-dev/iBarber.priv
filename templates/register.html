{% extends 'base.html' %}
{% block title %}Cadastrar — Barbearia{% endblock %}
{% block content %}
<style>.fab { display: none !important; }</style>
<section class="auth-section">
  <div class="auth-card stagger">
    <div class="auth-header">
      <span class="logo-mark">✦</span>
      <h1 class="auth-title">Criar conta</h1>
      <p class="auth-sub">Preencha seus dados para continuar</p>
    </div>
    <form class="auth-form" id="registerForm" method="POST" action="{{ url_for('register') }}" novalidate
          onsubmit="return validarForm(this)">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="field">
        <label class="field-label" for="name">Nome completo <span class="required">*</span></label>
        <input
          class="field-input"
          type="text"
          id="name"
          name="name"
          placeholder="Seu nome"
          required
          autocomplete="name"
        />
      </div>
      <div class="field">
        <label class="field-label" for="email">E-mail <span class="required">*</span></label>
        <input
          class="field-input"
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com"
          required
          autocomplete="email"
          oninput="this.value=this.value.toLowerCase()"
        />
      </div>
      <div class="field" id="fieldPassword">
        <label class="field-label" for="password">Senha <span class="required">*</span></label>
        <div class="field-input-wrap">
          <input
            class="field-input"
            type="password"
            id="password"
            name="password"
            placeholder="Mínimo 6 caracteres"
            required
            minlength="6"
            autocomplete="new-password"
            oninput="atualizarForcaSenha(this.value)"
          />
          <button type="button" class="toggle-pw" aria-label="Mostrar senha" data-target="password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="pw-strength"><div class="pw-strength-bar" id="pwBar"></div></div>
      </div>
      <div class="field">
        <label class="field-label" for="contact">
          WhatsApp / Contato <span class="required">*</span>
        </label>
        <input
          class="field-input"
          type="tel"
          id="contact"
          name="contact"
          placeholder="(11) 99999-9999"
          required
          autocomplete="tel"
          oninput="validarContato(this)"
        />
        <p class="field-hint" id="contactHint" style="display:none;color:var(--error);font-size:0.78rem;margin-top:4px;">Mínimo 8 números.</p>
      </div>
      <div class="field">
        <label class="field-label" for="observation">
          Observação
          <span class="optional">— opcional</span>
        </label>
        <textarea
          class="field-input field-textarea"
          id="observation"
          name="observation"
          placeholder="Alguma preferência ou alergia?"
          rows="3"
        ></textarea>
      </div>
      <p class="required-note"><span class="required">*</span> Campos obrigatórios</p>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);">
        <span style="font-size:.85rem;color:var(--text-muted);">Receber lembretes de agendamento por e-mail</span>
        <label class="toggle-switch">
          <input type="checkbox" name="receber_lembretes" value="1" checked />
          <span class="toggle-track"></span>
        </label>
      </div>
      <button type="submit" class="btn btn-gold btn-full btn-lg">Criar conta</button>
    </form>
    <p class="auth-switch">
      Já tem conta? <a href="{{ url_for('login') }}" class="link-gold">Entrar</a>
    </p>
  </div>
</section>
<script>
function atualizarForcaSenha(v) {
  const bar = document.getElementById('pwBar');
  let lvl = 0;
  if (v.length >= 6) lvl++;
  if (v.length >= 10) lvl++;
  if (/[A-Z]/.test(v) || /[0-9]/.test(v)) lvl++;
  if (/[^A-Za-z0-9]/.test(v) && v.length >= 8) lvl++;
  bar.setAttribute('data-level', lvl > 0 ? lvl : '');
}
function validarContato(input) {
  const digitos = (input.value.match(/\d/g) || []).length;
  const hint = document.getElementById('contactHint');
  if (digitos > 0 && digitos < 8) {
    hint.style.display = 'block';
    input.style.borderColor = 'var(--error)';
  } else {
    hint.style.display = 'none';
    input.style.borderColor = '';
  }
}
function validarForm(form) {
  const contactEl = document.getElementById('contact');
  const digitos = (contactEl.value.match(/\d/g) || []).length;
  if (!contactEl.value.trim()) {
    contactEl.focus();
    return false;
  }
  if (digitos < 8) {
    document.getElementById('contactHint').style.display = 'block';
    contactEl.style.borderColor = 'var(--error)';
    contactEl.focus();
    return false;
  }
  form.querySelector('[type=submit]').classList.add('btn-loading');
  return true;
}
</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.fab').forEach(function(el) { el.remove(); });
});
</script>
{% endblock %}
